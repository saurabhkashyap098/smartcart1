<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Order Detail — SmartCart</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    .detail-layout{display:grid;grid-template-columns:1fr 320px;gap:16px}
    .info-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
    .info-row:last-child{border-bottom:none}
    .info-label{color:var(--text-secondary)}
    @media(max-width:768px){.detail-layout{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div id="navbar"></div>
<div class="container page-wrap">
  <div class="breadcrumb"><a href="/index.html">Home</a><span class="sep">›</span><a href="/pages/orders.html">My Orders</a><span class="sep">›</span><span>Order Detail</span></div>
  <div id="detailContent">
    <div class="loading-wrap"><div class="spinner"></div><p>Loading order…</p></div>
  </div>
</div>
<div id="footer"></div>
<script src="/js/api.js"></script>
<script>
if(!Auth.isLoggedIn()){window.location.href='/pages/login.html';}
const orderId=new URLSearchParams(window.location.search).get('id');

async function loadDetail(){
  const res=await OrderAPI.getOne(orderId);
  const el=document.getElementById('detailContent');
  if(!res?.ok){el.innerHTML='<div class="empty-state"><div class="empty-icon">😕</div><h3>Order not found</h3><a href="/pages/orders.html" class="btn btn-primary" style="margin-top:16px">Back to Orders</a></div>';return;}
  const o=res.data.order;
  const shortId='#'+o._id.slice(-8).toUpperCase();
  const steps=['placed','confirmed','processing','shipped','out_for_delivery','delivered'];
  const stepIdx=steps.indexOf(o.orderStatus);
  const cancelled=o.orderStatus==='cancelled';
  const canCancel=['placed','confirmed','processing'].includes(o.orderStatus);

  el.innerHTML=`
  <div style="background:#fff;border-radius:2px;box-shadow:var(--shadow);padding:16px 24px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
    <div>
      <div style="font-size:22px;font-weight:700;margin-bottom:4px">Order ${shortId}</div>
      <div style="font-size:13px;color:var(--text-secondary)">Placed on ${fmt.dateTime(o.createdAt)}</div>
    </div>
    <div style="display:flex;gap:12px;align-items:center">
      <span class="status-chip status-${o.orderStatus}" style="font-size:13px;padding:6px 16px">${o.orderStatus.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}</span>
      ${canCancel?`<button class="btn btn-danger btn-sm" onclick="cancelOrder()">Cancel Order</button>`:''}
    </div>
  </div>

  ${!cancelled&&stepIdx>=0?`<div class="section-card" style="padding:24px;margin-bottom:16px">
    <div style="font-size:16px;font-weight:700;margin-bottom:20px">Order Tracking</div>
    <div class="order-track">
      ${steps.map((s,i)=>`<div class="track-step ${i<stepIdx?'done':i===stepIdx?'active':''}">
        <div class="track-icon">${['📋','✅','⚙️','🚚','🏠','🎉'][i]}</div>
        <div class="track-label">${['Ordered','Confirmed','Processing','Shipped','Out for Delivery','Delivered'][i]}</div>
        ${i<=stepIdx&&o.statusHistory?`<div style="font-size:10px;color:var(--text-secondary);margin-top:2px">${fmt.date(o.statusHistory.find(h=>h.status===s)?.timestamp||o.createdAt)}</div>`:''}
      </div>`).join('')}
    </div>
  </div>`:''}

  <div class="detail-layout">
    <div>
      <div class="card" style="margin-bottom:16px">
        <div class="card-header">Order Items (${o.items.length})</div>
        <div>
          ${o.items.map(item=>`<div style="display:flex;gap:16px;padding:16px 20px;border-bottom:1px solid var(--border);align-items:center">
            <img src="${item.image||'https://via.placeholder.com/70'}" style="width:70px;height:70px;object-fit:contain;border:1px solid var(--border);border-radius:2px;flex-shrink:0" alt="${item.name}"/>
            <div style="flex:1">
              <a href="/pages/product.html?id=${item.product}" style="font-size:15px;font-weight:500;color:var(--text)">${item.name}</a>
              <div style="font-size:12px;color:var(--text-secondary);margin-top:4px">Brand: ${item.brand||'—'}</div>
              <div style="font-size:13px;margin-top:6px">Qty: <strong>${item.quantity}</strong> × ${fmt.price(item.price)}</div>
            </div>
            <div style="font-size:17px;font-weight:700">${fmt.price(item.price*item.quantity)}</div>
          </div>`).join('')}
        </div>
      </div>

      ${o.statusHistory?.length?`<div class="card">
        <div class="card-header">Status History</div>
        <div class="card-body">
          ${o.statusHistory.map(h=>`<div style="display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--border)">
            <div style="width:8px;height:8px;border-radius:50%;background:var(--primary);margin-top:5px;flex-shrink:0"></div>
            <div><div style="font-size:13px;font-weight:600;text-transform:capitalize">${h.status.replace(/_/g,' ')}</div>${h.note?`<div style="font-size:12px;color:var(--text-secondary)">${h.note}</div>`:''}
            <div style="font-size:11px;color:#bbb">${fmt.dateTime(h.timestamp)}</div></div>
          </div>`).join('')}
        </div>
      </div>`:''}
    </div>

    <div>
      <div class="card" style="margin-bottom:12px">
        <div class="card-header">Price Breakdown</div>
        <div class="card-body">
          <div class="info-row"><span class="info-label">Items Total</span><span>${fmt.price(o.itemsTotal)}</span></div>
          <div class="info-row"><span class="info-label">Delivery</span><span style="color:var(--green)">${o.shippingCharge===0?'FREE':fmt.price(o.shippingCharge)}</span></div>
          <div class="info-row"><span class="info-label">Tax (GST)</span><span>${fmt.price(o.tax||0)}</span></div>
          <div class="info-row" style="font-size:16px;font-weight:700"><span>Total Paid</span><span>${fmt.price(o.totalAmount)}</span></div>
          <div class="info-row"><span class="info-label">Payment</span><span class="badge badge-info">${o.paymentMethod.toUpperCase()}</span></div>
          <div class="info-row"><span class="info-label">Payment Status</span><span class="badge ${o.paymentStatus==='paid'?'badge-success':'badge-warning'}">${o.paymentStatus}</span></div>
        </div>
      </div>
      <div class="card" style="margin-bottom:12px">
        <div class="card-header">Delivery Address</div>
        <div class="card-body" style="font-size:14px;line-height:1.8">
          <strong>${o.shippingAddress.name}</strong><br/>
          ${o.shippingAddress.addressLine1}${o.shippingAddress.addressLine2?',<br/>'+o.shippingAddress.addressLine2:''}<br/>
          ${o.shippingAddress.city}, ${o.shippingAddress.state} — ${o.shippingAddress.pincode}<br/>
          📱 ${o.shippingAddress.phone}
        </div>
      </div>
      ${o.razorpayPaymentId?`<div class="card">
        <div class="card-header">Payment Info</div>
        <div class="card-body" style="font-size:13px">
          <div class="info-row"><span class="info-label">Payment ID</span><span style="font-family:monospace;font-size:11px">${o.razorpayPaymentId}</span></div>
          ${o.paidAt?`<div class="info-row"><span class="info-label">Paid At</span><span>${fmt.dateTime(o.paidAt)}</span></div>`:''}
        </div>
      </div>`:''}
    </div>
  </div>`;
}

async function cancelOrder(){
  if(!confirm('Are you sure you want to cancel this order?'))return;
  const res=await OrderAPI.cancel(orderId,'Cancelled by customer');
  if(res?.ok){showToast('Order cancelled');setTimeout(()=>loadDetail(),800);}
  else showToast(res?.data?.message||'Failed','error');
}

document.addEventListener('DOMContentLoaded',loadDetail);
</script>
</body>
</html>
