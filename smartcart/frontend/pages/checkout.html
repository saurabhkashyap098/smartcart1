<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checkout — SmartCart</title>
  <meta name="description" content="Secure checkout — add delivery address and pay on SmartCart."/>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    .add-addr-form{background:var(--bg);border-radius:4px;padding:20px;margin-top:16px;display:none}
    .payment-icons{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .pay-method-icon{font-size:22px}
    .upi-input{margin-top:12px;display:none}
    .order-summary-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);align-items:center}
    .order-summary-item:last-child{border-bottom:none}
    .order-summary-item img{width:50px;height:50px;object-fit:contain;border:1px solid var(--border);border-radius:2px;flex-shrink:0}
    .place-order-btn{width:100%;padding:16px;font-size:16px;font-weight:700;background:var(--secondary);color:#fff;border:none;border-radius:2px;cursor:pointer;margin-top:16px;transition:background .2s}
    .place-order-btn:hover{background:#f05a10}
    .place-order-btn:disabled{opacity:.6;cursor:not-allowed}
  </style>
</head>
<body>
<div id="navbar"></div>
<div class="container page-wrap">
  <div class="breadcrumb"><a href="/index.html">Home</a><span class="sep">›</span><a href="/pages/cart.html">Cart</a><span class="sep">›</span><span>Checkout</span></div>
  <div class="checkout-layout" id="checkoutLayout">
    <div class="loading-wrap" style="grid-column:1/-1"><div class="spinner"></div><p>Loading checkout...</p></div>
  </div>
</div>
<div id="footer"></div>
<!-- Razorpay must load before checkout.js -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="/js/api.js"></script>
<script src="/js/checkout.js"></script>
</body>
</html>
