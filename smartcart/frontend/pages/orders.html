<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Orders — SmartCart</title>
  <link rel="stylesheet" href="/css/style.css"/>
  <style>
    .order-card{background:#fff;border-radius:2px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
    .order-card-header{background:var(--bg);padding:12px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
    .order-meta{font-size:12px;color:var(--text-secondary)}
    .order-meta strong{color:var(--text);display:block;font-size:13px}
    .order-item-row{display:flex;gap:16px;padding:16px 20px;border-bottom:1px solid var(--border);align-items:center;cursor:pointer;transition:background .15s}
    .order-item-row:hover{background:#fafafa}
    .order-item-img{width:60px;height:60px;object-fit:contain;border:1px solid var(--border);border-radius:2px;flex-shrink:0}
    .status-chip{font-size:12px;font-weight:700;padding:4px 12px;border-radius:12px}
    .status-placed,.status-confirmed{background:#e3f2fd;color:#1565c0}
    .status-processing{background:#fff8e1;color:#f57c00}
    .status-shipped,.status-out_for_delivery{background:#e8f5e9;color:var(--green)}
    .status-delivered{background:#e8f5e9;color:#2e7d32}
    .status-cancelled,.status-returned{background:#ffebee;color:var(--red)}
    .order-actions{padding:12px 20px;display:flex;gap:12px;flex-wrap:wrap}
    .filter-tabs{display:flex;gap:0;background:#fff;border-radius:2px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
    .filter-tab{padding:12px 20px;font-size:13px;font-weight:500;color:var(--text-secondary);cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap}
    .filter-tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:700}
    .filter-tab:hover{background:var(--bg)}
  </style>
</head>
<body>
<div id="navbar"></div>
<div class="container page-wrap">
  <div class="breadcrumb"><a href="/index.html">Home</a><span class="sep">›</span><span>My Orders</span></div>
  <div style="display:grid;grid-template-columns:240px 1fr;gap:16px">
    <!-- Sidebar -->
    <div class="card" style="height:fit-content;position:sticky;top:72px">
      <div class="card-header">My Account</div>
      <div style="padding:8px 0">
        <a href="/pages/profile.html" class="admin-nav-item"><span class="nav-icon">👤</span>Profile</a>
        <a href="/pages/orders.html" class="admin-nav-item active"><span class="nav-icon">📦</span>Orders</a>
        <a href="/pages/wishlist.html" class="admin-nav-item"><span class="nav-icon">❤️</span>Wishlist</a>
        <a href="/pages/profile.html#addresses" class="admin-nav-item"><span class="nav-icon">📍</span>Addresses</a>
      </div>
    </div>
    <!-- Main -->
    <div>
      <div style="background:#fff;border-radius:2px;box-shadow:var(--shadow);padding:16px 20px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
        <div style="font-size:20px;font-weight:700">My Orders</div>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="text" id="orderSearch" class="form-control" placeholder="Search orders…" style="width:220px" oninput="filterOrders()"/>
        </div>
      </div>
      <div class="filter-tabs" id="statusTabs">
        <div class="filter-tab active" data-status="">All Orders</div>
        <div class="filter-tab" data-status="placed">Placed</div>
        <div class="filter-tab" data-status="shipped">Shipped</div>
        <div class="filter-tab" data-status="delivered">Delivered</div>
        <div class="filter-tab" data-status="cancelled">Cancelled</div>
      </div>
      <div id="ordersList">
        <div class="loading-wrap"><div class="spinner"></div><p>Loading orders…</p></div>
      </div>
    </div>
  </div>
</div>

<!-- Cancel Modal -->
<div class="modal-overlay" id="cancelModal">
  <div class="modal" style="max-width:400px">
    <div class="modal-header"><span class="modal-title">Cancel Order</span><button class="modal-close" onclick="closeModal('cancelModal')">×</button></div>
    <div class="modal-body">
      <p style="color:var(--text-secondary);margin-bottom:16px">Please tell us why you want to cancel:</p>
      <select class="form-control" id="cancelReason">
        <option>Changed my mind</option>
        <option>Found better price elsewhere</option>
        <option>Ordered by mistake</option>
        <option>Delivery time too long</option>
        <option>Other</option>
      </select>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('cancelModal')">Keep Order</button>
      <button class="btn btn-danger" onclick="confirmCancel()">Cancel Order</button>
    </div>
  </div>
</div>

<div id="footer"></div>
<script src="/js/api.js"></script>
<script>
if(!Auth.isLoggedIn()){window.location.href='/pages/login.html?redirect=/pages/orders.html';}
let allOrders=[], filterStatus='', cancelOrderId='';

async function loadOrders(){
  const res=await OrderAPI.getMyOrders();
  if(res?.ok){allOrders=res.data.orders||[];renderOrders();}
  else document.getElementById('ordersList').innerHTML='<div class="empty-state"><div class="empty-icon">😕</div><h3>Failed to load orders</h3></div>';
}

function filterOrders(){
  const q=document.getElementById('orderSearch').value.toLowerCase();
  const filtered=allOrders.filter(o=>{
    const matchStatus=!filterStatus||o.status===filterStatus;
    const matchQ=!q||o._id.toLowerCase().includes(q)||o.items.some(i=>i.name.toLowerCase().includes(q));
    return matchStatus&&matchQ;
  });
  renderOrders(filtered);
}

function renderOrders(orders=allOrders){
  const el=document.getElementById('ordersList');
  if(!orders.length){el.innerHTML=`<div class="empty-state" style="background:#fff;border-radius:2px;box-shadow:var(--shadow)"><div class="empty-icon">📦</div><h3>No orders found</h3><p>Start shopping to see your orders here</p><a href="/index.html" class="btn btn-primary" style="margin-top:8px">Shop Now</a></div>`;return;}
  el.innerHTML=orders.map(o=>{
    const shortId='#'+o._id.slice(-8).toUpperCase();
    const canCancel=['pending','confirmed','processing'].includes(o.status);
    const steps=['pending','confirmed','processing','shipped','delivered'];
    const stepIdx=steps.indexOf(o.status);
    return `<div class="order-card">
      <div class="order-card-header">
        <div class="order-meta"><strong>Order ${shortId}</strong>Placed: ${fmt.date(o.createdAt)}</div>
        <div class="order-meta"><strong>${fmt.price(o.totalPrice)}</strong>${o.items.length} item${o.items.length!==1?'s':''} | ${o.paymentMethod.toUpperCase()}</div>
        <div class="order-meta"><strong>${o.shippingAddress.city}, ${o.shippingAddress.state}</strong>Pincode: ${o.shippingAddress.pincode}</div>
        <div style="margin-left:auto"><span class="status-chip status-${o.status}">${o.status.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())}</span></div>
      </div>
      ${o.status==='delivered'?`<div style="padding:8px 20px;background:#e8f5e9;font-size:13px;color:var(--green);font-weight:600">✅ Delivered on ${fmt.date(o.deliveredAt||o.updatedAt)}</div>`:''}
      ${stepIdx>=0&&o.status!=='cancelled'?`<div style="padding:12px 20px;overflow-x:auto"><div class="order-track">
        ${steps.map((s,i)=>`<div class="track-step ${i<stepIdx?'done':i===stepIdx?'active':''}"><div class="track-icon">${['📋','✅','⚙️','🚚','🎉'][i]}</div><div class="track-label">${['Ordered','Confirmed','Processing','Shipped','Delivered'][i]}</div></div>`).join('')}
      </div></div>`:''}
      ${o.items.map(item=>`<div class="order-item-row" onclick="window.location.href='/pages/product.html?id=${item.product}'">
        <img class="order-item-img" src="${item.image||'https://via.placeholder.com/60?text=P'}" alt="${item.name}"/>
        <div style="flex:1"><div style="font-size:14px;font-weight:500;margin-bottom:4px">${item.name}</div><div style="font-size:12px;color:var(--text-secondary)">Qty: ${item.quantity} &nbsp;|&nbsp; ${fmt.price(item.price)} each</div></div>
        <div style="font-weight:700;font-size:15px">${fmt.price(item.price*item.quantity)}</div>
      </div>`).join('')}
      <div class="order-actions">
        <a href="/pages/order-detail.html?id=${o._id}" class="btn btn-outline btn-sm">View Details</a>
        ${canCancel?`<button class="btn btn-sm btn-danger" onclick="openCancel('${o._id}')">Cancel Order</button>`:''}
        ${o.status==='delivered'?`<button class="btn btn-sm btn-outline" onclick="window.location.href='/pages/product.html?id=${o.items[0]?.product}'">Write Review</button>`:''}
        <button class="btn btn-sm btn-outline" onclick="reorder('${o._id}')">Reorder</button>
      </div>
    </div>`;
  }).join('');
}

function openCancel(id){cancelOrderId=id;document.getElementById('cancelModal').classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}
async function confirmCancel(){
  const reason=document.getElementById('cancelReason').value;
  const res=await OrderAPI.cancel(cancelOrderId,reason);
  if(res?.ok){showToast('Order cancelled');closeModal('cancelModal');loadOrders();}
  else showToast(res?.data?.message||'Failed to cancel','error');
}
async function reorder(orderId){
  const order=allOrders.find(o=>o._id===orderId);
  if(!order)return;
  let added=0;
  for(const item of order.items){const r=await CartAPI.add(item.product,item.quantity);if(r?.ok)added++;}
  if(added){showToast(`${added} item${added!==1?'s':''} added to cart 🛒`);updateCartBadge();}
  else showToast('Could not reorder items','error');
}

// Tabs
document.getElementById('statusTabs').addEventListener('click',e=>{
  const tab=e.target.closest('.filter-tab');
  if(!tab)return;
  document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');
  filterStatus=tab.dataset.status;
  filterOrders();
});

document.addEventListener('DOMContentLoaded',loadOrders);
</script>
</body>
</html>
